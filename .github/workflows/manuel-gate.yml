name: manuel-gate
on:
  pull_request: {types: [opened, synchronize, reopened]}
  pull_request_review: {types: [submitted, dismissed]}
  push: {branches: [main]}
permissions: {contents: read, pull-requests: read}
concurrency:
  group: manuel-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
        with: {ref: "${{ github.event.pull_request.base.sha }}", path: trusted}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - name: Estrutura no main
        if: github.event_name == 'push'
        run: python3 scripts/manuel_gate.py check-all --format github
      - name: Gate do PR
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" --paginate --slurp > reviews.json
          python3 trusted/scripts/manuel_gate.py check --repo . --config-dir trusted/config \
            --base "$BASE_SHA" --head "$HEAD_SHA" --reviews reviews.json --pr-author "$PR_AUTHOR" --format github
